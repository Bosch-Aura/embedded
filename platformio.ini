; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Comparte Brain-Aura/hardware.env con este firmware: convierte las claves
; compartidas en -D antes de compilar. Ver scripts/hardware_env.py.
extra_scripts = pre:scripts/hardware_env.py
monitor_filters = 
    default
    esp32_exception_decoder
build_flags =
    -DUART_BAUD=921600
    -DSERIAL_BAUD=115200
    ; Boots DISARMED: nothing moves until the client sends M:SYS_ARM:0
    ; (bfmc_hardware_bridge and Brain-Aura both do on connect). Adding
    ; -DBOOT_ARMED here skips that handshake and obeys the first C:SET_SPEED.
lib_deps =
    madhephaestus/ESP32Servo@^3.0.7

; Development-only environment: waits 3 s after hardware_init() so the serial
; monitor has time to attach. Never use this build on the vehicle.
[env:esp32doit-devkit-v1-debug]
extends = env:esp32doit-devkit-v1
build_flags =
    ${env:esp32doit-devkit-v1.build_flags}
    -DWAIT_FOR_SERIAL_MONITOR
