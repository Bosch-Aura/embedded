; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = 
    default
    esp32_exception_decoder
build_flags =
    -DUART_BAUD=921600
    -DSERIAL_BAUD=115200
lib_deps =
    madhephaestus/ESP32Servo@^3.0.7

; Development-only environment: waits 3 s after hardware_init() so the serial
; monitor has time to attach. Never use this build on the vehicle.
[env:esp32doit-devkit-v1-debug]
extends = env:esp32doit-devkit-v1
build_flags =
    ${env:esp32doit-devkit-v1.build_flags}
    -DWAIT_FOR_SERIAL_MONITOR
